name: Build

on:
  push:
    branches: [stable, beta, alpha]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile app
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build (Release)
        run: |
          xcodebuild \
            -project Apfelbindung.xcodeproj \
            -scheme Apfelbindung \
            -configuration Release \
            clean build \
            CODE_SIGNING_ALLOWED=NO
