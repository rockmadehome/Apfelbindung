name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build .pkg and publish release
    runs-on: macos-lastest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "MARKETING_VERSION_OVERRIDE=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build installer
        run: ./build-pkg.sh

      - name: Prepare artifacts
        id: artifacts
        run: |
          set -euo pipefail
          PKG=$(find . -maxdepth 1 -name 'Apfelbindung-*.pkg' -print -quit)
          if [ -z "$PKG" ]; then
            echo "No .pkg generated" >&2
            exit 1
          fi
          PKG=${PKG#./}
          shasum -a 256 "$PKG" > "$PKG.sha256"
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          cat "$PKG.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apfelbindung-pkg
          path: |
            Apfelbindung-*.pkg
            Apfelbindung-*.pkg.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PKG: ${{ steps.artifacts.outputs.pkg }}
        run: |
          set -euo pipefail
          PRERELEASE=""
          case "$TAG" in
            *alpha*|*beta*|*rc*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$TAG" "$PKG" "$PKG.sha256" \
            --title "Apfelbindung $TAG" \
            --generate-notes \
            $PRERELEASE
